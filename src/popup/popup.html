<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>LiveTranslate</title>
    <style>
        :root {
            color-scheme: light;
            --background: #edf0f5;
            --surface: #ffffff;
            --text: #18253d;
            --secondary: #59677d;
            --line: #dce2ec;
            --accent: #3158bd;
            --accent-hover: #2549a8;
            --on-accent: #ffffff;
            --accent-soft: #edf2ff;
            --hover: #f5f7fa;
            --brand-surface: #f2f5fc;
            --brand-line: #e0e7f7;
            --footer-surface: #f7f9fc;
            --switch-off: #8a96aa;
            --error: #a63746;
            --motion: 160ms;
        }

        * { box-sizing: border-box; }
        html { width: 352px; max-height: 600px; background: var(--background); }
        body {
            width: 352px;
            max-height: 600px;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            background: var(--surface);
            color: var(--text);
            font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        button, input, summary { -webkit-tap-highlight-color: transparent; }
        button { font: inherit; }
        button, summary { cursor: pointer; touch-action: manipulation; }
        button {
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            background: transparent;
            transition: background-color var(--motion), border-color var(--motion), transform 120ms;
        }
        button:hover:not(:disabled), summary:hover { background: var(--hover); }
        button:active:not(:disabled) { background: var(--accent-soft); transform: translateY(1px); }
        button:disabled { opacity: .6; cursor: default; }
        button[aria-busy=true]:disabled { cursor: wait; }
        button:focus-visible, summary:focus-visible, a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }
        [hidden] { display: none !important; }
        .header { display: flex; align-items: center; gap: 11px; padding: 14px 22px 12px; }
        .brand-tile { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid var(--brand-line); border-radius: 10px; background: var(--brand-surface); }
        .brand-mark { display: block; width: 26px; height: 26px; color: var(--accent); }
        h1 { margin: 0; font-size: 18px; font-weight: 630; letter-spacing: -.6px; line-height: 1.3; }
        .header p { margin: 4px 0 0; color: var(--secondary); font-size: 12px; }
        .content { margin: 0; padding: 0 22px 8px; background: var(--surface); }
        .page-health { padding: 2px 0 5px; border-top: 1px solid var(--line); }
        .page-health-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
        #page-status { color: var(--secondary); font-size: 12px; }
        .page-health[data-state=ready] #page-status { color: var(--accent); }
        #recover-page { flex: 0 0 auto; min-height: 34px; padding: 5px 0 5px 8px; color: var(--accent); font-size: 12px; }
        #recover-page:hover:not(:disabled) { background: transparent; text-decoration: underline; }
        #page-hint { margin: 0; color: var(--secondary); font-size: 12px; }
        .status-section { padding-top: 8px; }
        .toggle-switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .status-heading { display: flex; align-items: center; flex-wrap: wrap; column-gap: 9px; row-gap: 2px; font-weight: 600; }
        #status-text { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; }
        #status-text::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        #status-text.enabled { color: var(--accent); }
        #status-text.disabled { color: var(--secondary); }
        .status-detail { margin: 4px 0 0; color: var(--secondary); font-size: 12px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 44px; flex: 0 0 auto; cursor: pointer; }
        .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
        .slider { position: absolute; inset: 10px 0; background: var(--switch-off); border-radius: 24px; pointer-events: none; transition: background-color var(--motion); }
        .slider::before { position: absolute; content: ''; width: 18px; height: 18px; top: 3px; left: 3px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px #0f1c3c25; transition: transform var(--motion); }
        input:checked + .slider { background: var(--accent); }
        input:checked + .slider::before { transform: translateX(20px); background: var(--on-accent); }
        input:focus-visible + .slider { outline: 3px solid var(--accent); outline-offset: 4px; }
        .switch input:disabled { cursor: wait; }
        input:disabled + .slider { opacity: .6; }
        .reading-section { margin-top: 8px; }
        .reading-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; font-size: 13px; font-weight: 500; }
        #reading-state { color: var(--secondary); font-size: 12px; font-weight: 400; }
        .reading-hint { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: -2px; color: var(--secondary); font-size: 12px; line-height: 1.7; }
        #reading-detail { margin: 0; }

        .translate-section { margin-top: 15px; }
        #translate-now { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 46px; padding: 11px 15px; border-color: var(--accent); border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 560; }
        #translate-now:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
        #translate-now:active:not(:disabled) { background: var(--accent-hover); }
        #translate-now kbd { flex: 0 1 auto; max-width: 140px; overflow: hidden; text-overflow: ellipsis; border-color: #ffffff55; background: #ffffff16; color: inherit; font-size: 11px; font-weight: 400; }
        .translate-hint { margin: 8px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.7; }
        .translate-hint a { color: var(--accent); text-underline-offset: 3px; }
        .shortcut-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--secondary); font-size: 12px; line-height: 1.7; }
        .shortcut-status p { margin: 0; }
        #bind-translate-shortcut { flex: 0 0 auto; min-height: 44px; padding: 8px 0 8px 4px; color: var(--accent); font-size: 12px; }
        #bind-translate-shortcut:hover { background: transparent; text-decoration: underline; }
        kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--hover); font: inherit; color: var(--text); white-space: nowrap; }
        .service-section { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
        .section-heading { margin: 0 0 5px; font-size: 12px; font-weight: 500; color: var(--secondary); }
        #translation-mode { min-height: 22px; margin: 0; font-size: 13px; font-weight: 500; line-height: 1.7; overflow-wrap: anywhere; }
        #model-status { margin: 3px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.7; }
        .pack-row { display: flex; align-items: center; gap: 8px; min-height: 32px; }
        #model-status[data-compact=true] { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
        #model-status[data-compact=true] .pack-row + .pack-row { border-left: 1px solid var(--line); padding-left: 12px; }
        #model-status[data-compact=true] .pack-action { padding-left: 0; }
        .pack-name { min-width: 44px; font-weight: 500; }
        .pack-state { flex: 1; }
        .pack-state[data-error=true] { color: var(--error); }
        .pack-action { flex: 0 0 auto; min-height: 32px; padding: 4px 0 4px 8px; color: var(--accent); font-size: 12px; }
        .pack-action:hover:not(:disabled) { background: transparent; text-decoration: underline; }
        #model-note { margin: 4px 0 0; font-size: 12px; color: var(--secondary); }
        .service-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .secondary-button { flex: 1; min-width: 0; min-height: 40px; padding: 7px 8px; border-color: var(--line); font-size: 12px; font-weight: 500; }
        .secondary-button:hover:not(:disabled) { border-color: var(--secondary); }
        #retry-read { min-height: 36px; margin-top: 5px; padding: 6px 0; color: var(--accent); font-size: 12px; }
        #retry-read:hover:not(:disabled) { background: transparent; text-decoration: underline; }
        .shortcut-section { margin-top: 13px; padding-top: 3px; border-top: 1px solid var(--line); }
        summary { min-height: 38px; padding: 9px 4px; border-radius: 4px; color: var(--secondary); font-size: 12px; }
        .shortcut-list { display: grid; gap: 8px; padding: 8px 4px 5px; }
        .shortcut-list p { margin: 0; font-size: 12px; }
        .shortcut-note { color: var(--secondary); }
        #configure-shortcuts { justify-self: start; min-height: 36px; padding: 6px 0; color: var(--accent); font-size: 12px; }
        #configure-shortcuts:hover { text-decoration: underline; background: transparent; }
        .feedback { margin: 0 22px 12px; padding: 8px 10px; border-left: 2px solid var(--accent); border-radius: 0 5px 5px 0; background: var(--accent-soft); color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
        .feedback:empty { display: none; }
        .feedback.error { color: var(--error); border-color: var(--error); background: #fff0f2; }
        .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 22px 5px; border-top: 1px solid var(--line); background: var(--footer-surface); color: var(--secondary); font-size: 12px; }
        #user-guide { flex: 0 0 auto; min-height: 34px; margin-right: -8px; padding: 5px 8px; font-size: 12px; color: var(--secondary); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand-tile">
            <svg class="brand-mark" data-brand-mark viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
                <path d="M12 9h31c7.73 0 14 6.27 14 14v1H40c-6.63 0-12 3.63-12 9H17v-8a5 5 0 0 0-5-5H7v-6a5 5 0 0 1 5-5Z"/>
                <path d="M36 32h11v7a5 5 0 0 0 5 5h5v6a5 5 0 0 1-5 5H21c-7.73 0-14-6.27-14-14v-1h17c6.63 0 12-2.63 12-8Z"/>
            </svg>
        </div>
        <div>
            <h1>LiveTranslate</h1>
            <p>用中文写，从容表达。</p>
        </div>
    </header>

    <main class="content">
        <section class="page-health" id="page-health" aria-label="当前网页状态" data-state="checking">
            <div class="page-health-row">
                <span id="page-status" role="status" aria-live="polite">正在检查当前网页…</span>
                <button id="recover-page" type="button" hidden>重新接入</button>
            </div>
            <p id="page-hint" hidden></p>
        </section>
        <section class="status-section" aria-labelledby="status-heading">
            <div class="toggle-switch">
                <div>
                    <div class="status-heading"><span id="status-heading">输入中译英</span><span id="status-text" class="disabled">正在读取</span></div>
                    <p class="status-detail" id="status-detail">正在确认输入翻译状态…</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-switch" role="switch" aria-labelledby="status-heading" aria-describedby="status-text status-detail" disabled>
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>
        </section>

        <section class="reading-section" aria-labelledby="reading-heading">
            <div class="toggle-switch">
                <div class="reading-heading"><span id="reading-heading">划词英译中</span><span id="reading-state">正在读取</span></div>
                <label class="switch">
                    <input type="checkbox" id="reading-toggle" role="switch" aria-labelledby="reading-heading" aria-describedby="reading-state reading-detail" disabled>
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>
            <div class="reading-hint">
                <p id="reading-detail">正在确认划词翻译状态…</p>
            </div>
        </section>

        <section class="translate-section" aria-label="手动翻译">
            <button id="translate-now" type="button" aria-describedby="translate-hint" disabled>
                <span id="translate-label">手动翻译</span>
                <kbd id="primary-shortcut" hidden></kbd>
            </button>
            <p class="translate-hint" id="translate-hint">正文选区英译中，输入草稿中译英。</p>
            <div class="shortcut-status" id="shortcut-status" hidden>
                <p id="shortcut-status-text" role="status" aria-live="polite"></p>
                <button id="bind-translate-shortcut" type="button">设置快捷键</button>
            </div>
        </section>

        <section class="service-section" aria-labelledby="service-heading">
            <h2 class="section-heading" id="service-heading">当前翻译服务</h2>
            <p id="translation-mode">正在读取服务…</p>
            <div id="model-status" role="status" aria-live="polite" aria-atomic="true" hidden>
                <div class="pack-row"><span class="pack-name">中译英</span><span class="pack-state" id="writing-pack-status">检查中</span><button class="pack-action" id="prepare-translation" type="button" hidden>准备</button></div>
                <div class="pack-row"><span class="pack-name">英译中</span><span class="pack-state" id="reading-pack-status">检查中</span><button class="pack-action" id="prepare-reading" type="button" hidden>准备</button></div>
            </div>
            <p id="model-note" hidden></p>
            <div class="service-actions">
                <button class="secondary-button" id="translation-settings" type="button">翻译设置</button>
            </div>
            <button id="retry-read" type="button" hidden>重试读取状态</button>
        </section>

        <details class="shortcut-section">
            <summary>快捷键与操作提示</summary>
            <div class="shortcut-list">
                <p id="toggle-shortcut">正在读取输入中译英快捷键…</p>
                <p id="translate-shortcut">正在读取翻译快捷键…</p>
                <p class="shortcut-note">显示浏览器中的实际绑定。输入框内确认译文后按 <kbd>Tab</kbd> 替换原文；未设置时可在下方添加。</p>
                <button id="configure-shortcuts" type="button">设置快捷键</button>
            </div>
        </details>
    </main>

    <p class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    <footer class="footer">
        <span>版本 1.0.8</span>
        <button id="user-guide" type="button">使用说明</button>
    </footer>
    <script src="popup.js"></script>
</body>
</html>
