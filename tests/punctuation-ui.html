<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>LiveTranslate 标点与替换回归</title>
<style>body{font:16px sans-serif;margin:32px}textarea{width:500px;height:80px}pre{white-space:pre-wrap}</style>
<h1>标点与替换回归</h1>
<p>先执行 npm run build:local。接口替身故意返回 Hello?，检查实际内容脚本是否统一处理显示、复制及替换。</p>
<textarea id="input" aria-label="翻译测试框"></textarea>
<pre id="results">等待测试…</pre>
<script>
window.chrome = window.chrome || {};
window.testApiCalls = 0;
chrome.runtime = {
  onMessage: { addListener() {} },
  sendMessage(message) {
    if (message.type === 'GET_POPUP_OFFSET') return chrome.storage.local.get('liveTranslatePopupOffset').then(value => ({success:true,offset:value.liveTranslatePopupOffset || null}));
    if (message.type === 'SET_POPUP_OFFSET' || message.type === 'CLEAR_POPUP_OFFSET') return Promise.resolve({success:true});
    if (message.type === 'GET_TRANSLATION_CONFIG') return Promise.resolve({success:true,config:{provider:'volcengine',revision:'initial'}});
    if (message.type === 'GET_EXTENSION_STATE') return Promise.resolve({ enabled: true });
    return new Promise(callback => {
    window.testApiCalls++;
    callback({ success: true, data: { translatedText: 'Hello?', detectedSourceLanguage: 'zh' } });
    });
  }
};
chrome.storage = { local: { async get() { return {}; }, async set() {}, async remove() {} } };
Object.defineProperty(navigator, 'clipboard', { value: {
  async writeText(text) {
    if (window.testClipboardFailure) throw new Error('clipboard denied');
    window.testCopiedText = text;
  }
} });
</script>
<script src="../dist-local/content/content.js"></script>
<script>
window.testResults = [];
window.addEventListener('load', async () => {
  const settle = ms => new Promise(resolve => setTimeout(resolve, ms));
  const input = document.getElementById('input');
  const record = (name, actual, expected) => window.testResults.push({ name, actual, expected, passed: actual === expected });
  const translate = async () => {
    input.value = '你好。';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.dispatchEvent(new InputEvent('input', { bubbles: true }));
    await settle(360);
  };
  await settle(30);
  await translate();
  record('界面显示正确句号', document.querySelector('.translated-text')?.textContent, 'Hello.');
  document.querySelector('.action-copy')?.click();
  await settle(20);
  record('复制与显示一致', window.testCopiedText, 'Hello.');
  window.testClipboardFailure = true;
  document.querySelector('.action-copy')?.click();
  await settle(20);
  record('复制失败有明确反馈', document.querySelector('.action-copy')?.textContent?.includes('复制失败'), true);
  window.testClipboardFailure = false;
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
  record('Tab 替换无额外中文句号', input.value, 'Hello.');
  await settle(350);
  await translate();
  record('缓存命中仍显示正确句号', document.querySelector('.translated-text')?.textContent, 'Hello.');
  record('缓存避免重复请求', window.testApiCalls, 1);
  document.querySelector('.action-replace')?.click();
  record('按钮替换无额外中文句号', input.value, 'Hello.');
  document.getElementById('results').textContent = JSON.stringify(window.testResults, null, 2);
  window.testsFinished = true;
});
</script>
</html>
